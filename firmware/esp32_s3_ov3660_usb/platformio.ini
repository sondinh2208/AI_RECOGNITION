[platformio]
src_dir = .

[env:esp32-s3-wroom-cam-usb]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_port = COM11
# Khi giu BOOT + nhan RST, USB-Serial/JTAG cua bo xuat hien tai COM12.
# COM13 la cong CDC runtime de truyen frame, khong dung de nap firmware.
upload_port = COM12
upload_speed = 460800
board_build.arduino.memory_type = qio_opi
build_unflags =
    -DARDUINO_USB_MODE=1
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
