[platformio]
src_dir = .
default_envs = esp32-s3-n16r8

[env:esp32-s3-n16r8]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino

; ESP32-S3-WROOM-1-N16R8: 16 MB QSPI Flash + 8 MB OPI PSRAM.
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi

monitor_speed = 115200
upload_speed = 460800
upload_port = COM17
monitor_port = COM17
monitor_dtr = 0
monitor_rts = 0
; CH343 tren bo nay khong dua ESP32-S3 vao download mode on dinh bang DTR/RTS.
; Vao bootloader thu cong va khong de esptool reset lai bo truoc khi nap.
board_upload.before_reset = no_reset
monitor_filters = esp32_exception_decoder

lib_deps =
    adafruit/Adafruit Fingerprint Sensor Library @ ^2.1.3
    adafruit/Adafruit SSD1306 @ ^2.5.15
    adafruit/Adafruit GFX Library @ ^1.12.1
    knolleary/PubSubClient @ ^2.8
    witnessmenow/UniversalTelegramBot @ ^1.3.0
    bblanchon/ArduinoJson @ ^6.21.5

build_flags =
    -DBOARD_HAS_PSRAM
