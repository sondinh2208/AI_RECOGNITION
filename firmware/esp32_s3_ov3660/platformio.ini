[platformio]
src_dir = .

[env:esp32-s3-wroom-cam]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_port = COM18
upload_port = COM18
upload_speed = 460800
; CH343 tren bo nay khong giu download mode on dinh khi esptool toggle DTR/RTS.
; Vao bootloader thu cong va khong reset bo lan nua truoc khi nap.
board_upload.before_reset = no_reset
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM
    -DFACECHECK_AP_ONLY_TEST=0
    -DFACECHECK_WIFI_ONLY_DIAGNOSTIC=0
