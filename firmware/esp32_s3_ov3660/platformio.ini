[platformio]
src_dir = .

[env:esp32-s3-wroom-cam]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino
lib_deps =
    links2004/WebSockets @ ^2.6.1
monitor_speed = 115200
monitor_port = COM11
upload_port = COM11
upload_speed = 460800
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM
    -DFACECHECK_AP_ONLY_TEST=0
    -DFACECHECK_WIFI_ONLY_DIAGNOSTIC=0
    -DWEBSOCKETS_TCP_TIMEOUT=1000
