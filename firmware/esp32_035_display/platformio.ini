[platformio]
src_dir = src
default_envs = esp32-035-st7796

[env]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
upload_port = COM14
monitor_port = COM14
lib_deps =
    lovyan03/LovyanGFX@^1.2.7
    bblanchon/ArduinoJson@^7.4.2
build_flags =
    -DCORE_DEBUG_LEVEL=0

; Phần lớn bo ESP32-035 3.5 inch dùng ST7796.
[env:esp32-035-st7796]
build_flags =
    ${env.build_flags}
    -DFACECHECK_PANEL_ST7796=1

; Một số lô dùng ILI9488. Dùng môi trường này nếu ST7796 chỉ hiện trắng/đen/nhiễu.
[env:esp32-035-ili9488]
build_flags =
    ${env.build_flags}
    -DFACECHECK_PANEL_ILI9488=1
